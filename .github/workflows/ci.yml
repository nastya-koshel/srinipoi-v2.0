name: CI

on:
  push:
    branches: [develop, 'feature/', 'release/', 'hotfix/**']
  pull_request:
    branches: [develop, main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build Docker image
        run: docker build -t go-app:ci .
